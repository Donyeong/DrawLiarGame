name: drawliar-dev
x-app: &app
  image: ${DRAWLIAR_IMAGE:-drawliar-app:current}
  restart: unless-stopped
  init: true
  mem_limit: 384m
  cpus: 0.5
  volumes:
    - /srv/drawliar/dev/secrets:/secrets:ro
  environment: &environment
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__DrawLiarDatabase: ${DRAWLIAR_DATABASE}
    Cluster__Key: ${DRAWLIAR_CLUSTER_KEY}
    Cluster__CertificateSha256: ${DRAWLIAR_CERTIFICATE_SHA256:?TLS 인증서 SHA256 필요}
    ASPNETCORE_Kestrel__Endpoints__Internal__Url: http://0.0.0.0:8080
    ASPNETCORE_Kestrel__Certificates__Default__Path: /secrets/server.pfx
    ASPNETCORE_Kestrel__Certificates__Default__Password: ${DRAWLIAR_TLS_PASSWORD}
    Network__TrustedProxies__0: ${DRAWLIAR_WEB_PROXY_IP:-127.0.0.1}
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
services:
  db:
    image: drawliar-postgres:16-noble
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_PASSWORD: ${DRAWLIAR_DB_PASSWORD}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "drawliar", "-d", "drawliar"]
      interval: 5s
      timeout: 5s
      retries: 20
  main:
    <<: *app
    working_dir: /apps/MainServer
    command: ["dotnet", "DrawLiar.MainServer.dll"]
    ports: ["19050:19050"]
    environment:
      <<: *environment
      ASPNETCORE_Kestrel__Endpoints__Public__Url: https://0.0.0.0:19050
      MainServer__PublicUrl: https://${DRAWLIAR_PUBLIC_HOST}:19050
      GameServer__PublicUrl: https://${DRAWLIAR_PUBLIC_HOST}:19060
      GameServer__NodeId: game-1
      Google__DesktopClientId: ${GOOGLE_DESKTOP_CLIENT_ID:-}
      Google__DesktopClientSecret: ${GOOGLE_DESKTOP_CLIENT_SECRET:-}
      Google__MobileClientId: ${GOOGLE_MOBILE_CLIENT_ID:-}
      Google__WebClientId: ${GOOGLE_WEB_CLIENT_ID:-}
  game:
    <<: *app
    working_dir: /apps/GameServer
    command: ["dotnet", "DrawLiar.GameServer.dll"]
    ports: ["19060:19060"]
    environment:
      <<: *environment
      ASPNETCORE_Kestrel__Endpoints__Public__Url: https://0.0.0.0:19060
      GameServer__PublicUrl: https://${DRAWLIAR_PUBLIC_HOST}:19060
      GameServer__MainServerUrl: https://main:19050
      GameServer__NodeId: game-1
      Commerce__GooglePlay__Enabled: ${DRAWLIAR_GOOGLE_PLAY_ENABLED:-false}
      Commerce__GooglePlay__PackageName: com.rascallab.liargame
      Commerce__GooglePlay__CredentialsFile: ${DRAWLIAR_GOOGLE_PLAY_CREDENTIALS_FILE:-/secrets/google-play.json}
      Commerce__GooglePlay__TokenEncryptionKeyFile: ${DRAWLIAR_GOOGLE_PLAY_TOKEN_KEY_FILE:-/secrets/google-play-token.key}
      Advertising__Enabled: ${DRAWLIAR_ADS_ENABLED:-false}
      Advertising__Android__Enabled: ${DRAWLIAR_ADS_ANDROID_ENABLED:-false}
      Advertising__Android__BannerAdUnitId: ${DRAWLIAR_ADS_ANDROID_BANNER_ID:-}
      Advertising__Android__RewardedAdUnitId: ${DRAWLIAR_ADS_ANDROID_REWARDED_ID:-}
      Advertising__Web__Enabled: ${DRAWLIAR_ADS_WEB_ENABLED:-false}
      Advertising__Web__PublisherId: ${DRAWLIAR_ADS_WEB_PUBLISHER_ID:-}
      Advertising__Web__BannerSlotId: ${DRAWLIAR_ADS_WEB_BANNER_SLOT_ID:-}
      Advertising__Web__AllowClientVerification: ${DRAWLIAR_ADS_WEB_CLIENT_VERIFICATION:-false}
  dedicated:
    <<: *app
    image: ${DRAWLIAR_DEDICATED_IMAGE:-${DRAWLIAR_IMAGE:-drawliar-app:current}}
    working_dir: /apps/DedicatedServer
    command: ["dotnet", "DrawLiar.DedicatedServer.dll"]
    mem_limit: 512m
    volumes:
      - /srv/drawliar/dev/secrets:/secrets:ro
      - dedicated-outbox:/var/lib/drawliar/outbox
    environment:
      <<: *environment
      ASPNETCORE_Kestrel__Endpoints__Public__Url: https://0.0.0.0:19070
      Dedicated__NodeId: dedicated-1
      Dedicated__GameServerUrl: https://game:19060
      Dedicated__PublicUrl: wss://${DRAWLIAR_PUBLIC_HOST}:19070/play
      Dedicated__Capacity: 16
      Dedicated__OutboxPath: /var/lib/drawliar/outbox
    ports: ["19070:19070"]
  admin:
    <<: *app
    image: ${DRAWLIAR_ADMIN_IMAGE:-${DRAWLIAR_IMAGE:-drawliar-app:current}}
    working_dir: /apps/AdminServer
    command: ["dotnet", "DrawLiar.AdminServer.dll"]
    volumes:
      - /srv/drawliar/dev/secrets:/secrets:ro
      - admin-data-protection:/var/lib/drawliar/admin-data-protection
    environment:
      <<: *environment
      ASPNETCORE_Kestrel__Endpoints__Public__Url: https://0.0.0.0:19080
      Admin__Key: ${DRAWLIAR_ADMIN_KEY:-}
      Admin__UsersFile: /secrets/admin-users.json
      Admin__DataProtectionKeysPath: /var/lib/drawliar/admin-data-protection
    ports: ["19080:19080"]
volumes:
  database:
  dedicated-outbox:
  admin-data-protection:
